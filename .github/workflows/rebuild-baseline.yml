name: Rebuild Baseline

on:
  schedule:
    - cron: '30 20 1 * *'  # 1st of every month at 02:00 IST (20:30 UTC)
  workflow_dispatch:        # also allow manual trigger from GitHub UI

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push the updated baseline.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Rebuild baseline
        env:
          CHATWOOT_API_TOKEN: ${{ secrets.CHATWOOT_API_TOKEN }}
        run: python3 scripts/rebuild-baseline.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/baseline.json
          if git diff --cached --quiet; then
            echo "baseline.json unchanged — nothing to commit"
          else
            git commit -m "chore: auto-rebuild baseline.json (monthly)"
            git push
          fi
